[package]
name = "alphin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Display manager adapters and greeter lifecycle worker"

[lib]
name = "alphin"
path = "src/lib.rs"

[[bin]]
name = "alphin-worker"
path = "src/main.rs"

[[bin]]
name = "alphind"
path = "src/daemon_main.rs"

[[bin]]
name = "alphin-doctor"
path = "src/doctor_main.rs"

[[bin]]
name = "alphin-e2e"
path = "src/e2e_main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zeroize = "1"
zbus = "5"
